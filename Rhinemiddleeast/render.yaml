services:
  - type: web
    name: rhine-middle-east
    env: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Rhinemiddleeast/Dockerfile
    dockerContext: ./Rhinemiddleeast
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
